<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | JKT48 OFC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top py-3">
        <div class="container">
            <a class="navbar-brand" href="index.html">JKT48<span>.</span>OFC</a>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="signin.html">Sign In</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="min-vh-100 d-flex align-items-center justify-content-center pt-5">
        <div class="container mt-5" style="max-width: 550px;">
            <div class="glass-panel gsap-reveal">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">JOIN THE <span class="text-danger">CLUB</span></h2>
                    <p class="text-secondary small">Daftar untuk akses prioritas tiket & benefit eksklusif.</p>
                </div>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Nama Lengkap</label>
                        <input type="text" class="form-control" placeholder="Sesuai KTP / KTM">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Aktif</label>
                        <input type="email" class="form-control" placeholder="email@domain.com">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" placeholder="Min. 8 karakter">
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label">Konfirmasi Password</label>
                            <input type="password" class="form-control" placeholder="Ulangi password">
                        </div>
                    </div>
                    <button type="button" class="btn-jkt mb-3">BUAT AKUN</button>
                    <p class="text-center text-secondary small">Sudah punya akun? <a href="signin.html" class="text-danger fw-bold text-decoration-none">Login di sini</a></p>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
