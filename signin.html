<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sign In | JKT48 OFC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top py-3">
        <div class="container">
            <a class="navbar-brand" href="index.html">JKT48<span>.</span>OFC</a>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="signup.html">Sign Up</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="min-vh-100 d-flex align-items-center justify-content-center">
        <div class="container" style="max-width: 500px;">
            <div class="glass-panel gsap-reveal">
                <div class="text-center mb-5">
                    <h2 class="fw-bold">WELCOME <span class="text-danger">BACK</span></h2>
                    <p class="text-secondary small">Masuk ke akun Official Fan Club kamu.</p>
                </div>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Email OFC</label>
                        <input type="email" class="form-control" placeholder="Contoh: intan@gmail.com">
                    </div>
                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label class="form-label">Password</label>
                            <a href="#" class="text-danger small text-decoration-none">Lupa Password?</a>
                        </div>
                        <input type="password" class="form-control" placeholder="••••••••">
                    </div>
                    <button type="button" class="btn-jkt mb-4">MASUK</button>
                    <p class="text-center text-secondary small">Belum jadi anggota? <a href="signup.html" class="text-danger fw-bold text-decoration-none">Daftar Sekarang</a></p>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
